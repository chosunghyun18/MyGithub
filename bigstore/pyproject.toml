[project]
name = "mygithub-bigstore"
version = "0.1.0"
description = "2GB 초과 파일을 청크 단위 content-addressed 저장 + git 포인터로 버전 관리"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# s3 = ["boto3"]  # Phase 2: S3 / Cloudflare R2 백엔드

[project.scripts]
bigstore = "bigstore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bigstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
